name: 부모 이슈
description: 공통 사건·목표를 직접 자식으로 나누고 범위·진행 순서·통합 완료 조건 관리
title: "[부모] "
body:
  - type: markdown
    attributes:
      value: |
        **작성 요령**
        - **역할**: 부모는 자체 구현 PR 없이 독립적으로 끝낼 자식의 결과·진행 순서·통합 완료 조건 관리. 자식은 결함 보고·기능·개선 제안 양식을 사용하며 재현·구현·개별 검증은 자식에 작성. 하나의 PR로 끝나는 작업이나 PR 개수만으로 부모를 만들지 않음
        - **PR 분할**: 같은 완료 조건을 여러 PR로 나누면 결함 보고·기능·개선 제안 양식에서 관리
        - **중간 부모**: 여러 구현을 묶는 고유한 통합 결과가 있을 때만 이 양식을 사용하고 직접 부모와 분리 이유 명시. 단순 분야·순서 구분은 표로 표현
        - **제목**: `[부모]` 뒤에 공통 문제·목표를 짧은 명사형으로 표현. 예: `[부모] 녹화 프레임 누락 개선`
        - **라벨**: 생성 직후 성격(`bug` 또는 `enhancement`)·영역 라벨과 정확히 하나의 `priority:*` 라벨 적용. 자식의 라벨을 합치거나 우선순위를 물려주지 않음
        - **연결**: 직접 자식은 등록 직후 GitHub sub-issue, 실제 선행은 blocked-by로 연결. 포함 관계와 선행 관계를 구분. 기능을 쓸 수 없으면 본문 표에 제약을 명시
        - **이슈 번호**: 목록 안의 `#번호`는 GitHub가 제목·상태로 펼쳐 줄이 길어짐. 자식 지도와 관계는 표로 작성
        - **흐름도**: 자식 사이 의존이 단계 표만으로 읽기 어려울 때만 아래 `흐름도 (선택)`에 Mermaid로 추가

  - type: textarea
    id: summary
    attributes:
      label: 요약
      description: 전체 문제와 목표를 짧은 불릿 2-3개로. 명사형·단답형 종결(`~합니다`·`~습니다`·`~한다` 생략)
      placeholder: |
        - 녹화 파이프라인의 프레임 누락으로 결과 영상 끊김
        - 모드별 자식 작업으로 프레임 처리 경로 개선
    validations:
      required: true

  - type: textarea
    id: shared_context
    attributes:
      label: 현재 상태 (AS-IS)와 목표 상태 (TO-BE)
      description: 이 부모가 맡은 현재 문제와 목표를 각각 1-2문장으로. 확인된 사실과 가설을 구분하고 자식별 재현·구현 상세는 자식에 작성. 중간 부모는 직접 부모의 요약을 반복하지 않고 별도로 확인할 결과와 분리 이유 명시
      placeholder: |
        - AS-IS: 공통 문제와 영향받는 기능
        - TO-BE: 모든 자식이 끝난 뒤 기대하는 결과
        - 자식으로 나누는 이유:
        - 확인 근거 (확장 버전·커밋, 관찰 근거와 관련 이슈, 모르면 미확인):
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 범위와 제외 범위
      description: 이 부모가 맡은 범위와 보존할 동작. 직접 부모의 공통 규칙은 참조하고 반복하지 않음
      placeholder: |
        - 포함 범위:
        - 유지할 동작:
        - 제외 범위:
    validations:
      required: true

  - type: textarea
    id: children
    attributes:
      label: 자식 작업과 진행 순서
      description: 직접 자식만 표에 작성하고 부모/구현 유형을 구분. 아래 단계의 작업은 해당 부모에서 관리. 같은 단계도 실제 선행이 충족돼야 진행 가능. 등록 전에는 작업명, 등록 후에는 번호로 교체하며 PR은 자식으로 등록하지 않음
      placeholder: |
        | 단계 | 직접 자식 | 유형 | 담당 결과 | 직접 선행 |
        | :-: | --- | --- | --- | --- |
        | 1 | #번호 또는 작업명 | 구현 | 맡는 결과 한 줄 | 없음 |
        | 2 | #번호 | 구현 | 맡는 결과 한 줄 | #번호 |

        같은 단계는 선행이 충족되면 병렬 진행 가능. 통합 확인: 언제 무엇을 확인하는지
    validations:
      required: true

  - type: textarea
    id: relationships
    attributes:
      label: 직접 부모와 외부 선행 (선택)
      description: 중간 부모이면 직접 부모 명시. 외부의 일부 결과만 필요하면 해당 구현 이슈, 전체 통합 결과가 필요하면 해당 부모를 선행으로 연결. 자신을 포함하는 부모를 선행으로 두거나 순환을 만들지 않음
      placeholder: |
        | 관계 | 이슈 | 근거 |
        | --- | --- | --- |
        | 부모 | #번호 | 이 결과를 포함하는 직접 부모 |
        | 선행 | #번호 | 실제 필요한 결과와 기다리는 이유 |

  - type: textarea
    id: flow_diagram
    attributes:
      label: 흐름도 (선택)
      description: 표만으로 읽기 어려울 때만 Mermaid 코드 입력. 포함과 선행 중 어떤 관계인지 명시하고 함께 그리면 선 종류·범례로 구분. 선행 화살표는 먼저 필요한 작업에서 후행 방향
      placeholder: |
        flowchart LR
          A[기반 작업] --> B[적용 1]
          A --> C[적용 2]
          B --> D[통합 확인]
          C --> D
      render: mermaid

  - type: dropdown
    id: priority
    attributes:
      label: 요청 우선순위
      description: 부모라는 이유로 우선순위를 높이지 않음. 자식은 각자의 실제 영향으로 별도 판정
      options:
        - "priority:critical (P0) - 배포 빌드의 데이터 손실·개인정보 유출·전면 동작 불가"
        - "priority:high (P1) - 주요 기능의 잘못된 결과, 검사 실패, 릴리스 차단"
        - "priority:medium (P2) - 현재 기능의 유지보수·성능·검증 개선"
        - "priority:low (P3) - 영향이 좁거나 미룰 수 있는 문안·표시"
    validations:
      required: true

  - type: textarea
    id: priority_rationale
    attributes:
      label: 우선순위 근거
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 공통 완료 조건
      description: 이 부모만 확인할 통합 결과. 직접 자식과 그 아래 구현의 종료 결과 확인. 중복·취소 종료를 구현 완료로 세지 말고 남은 범위 반영. 자식 PR의 Closes로 부모를 자동 종료하지 않음
      placeholder: |
        - [ ] 직접 자식과 그 아래 구현의 종료 결과·미해결 범위 확인
        - [ ] 이 부모의 목표 동작과 보존할 동작 확인
        - [ ] 필요한 통합 검증(test:e2e·수동 체크리스트) 결과 확인
    validations:
      required: true

  - type: checkboxes
    id: submission_checks
    attributes:
      label: 등록 확인
      options:
        - label: 최신 main과 관련 이슈에서 같은 목표의 부모와 중복 작업 확인 (자식이 아직 없는 부모도 포함)
          required: true
        - label: 직접 자식만 관리하며 포함 관계와 실제 선행을 구분해 연결할 계획 확인
          required: true
        - label: 생성 직후 성격·영역 라벨과 정확히 하나의 `priority:*` 라벨 적용, 자식별 우선순위는 별도 판정
          required: true
