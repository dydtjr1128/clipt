name: 부모 이슈
description: 공통 사건·목표를 여러 자식 작업으로 나누고 범위·진행 순서·완료 조건을 관리합니다.
title: "[부모] "
body:
  - type: textarea
    id: summary
    attributes:
      label: 요약
      description: 전체 문제와 목표를 2~3개 불릿으로 요약. 한 줄의 짧은 단답형·명사형으로 작성하며 '~습니다', '~입니다', '~한다' 등 서술형 종결 금지.
      placeholder: |
        - 녹화 파이프라인의 프레임 누락으로 결과 영상 끊김
        - 모드별 자식 작업으로 프레임 처리 경로 개선
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        제목은 `[부모]` 뒤에 공통 문제·목표를 짧은 명사형으로 작성. 예: `[부모] 녹화 프레임 누락 개선`.
        부모는 자체 구현 PR 없이 공통 범위·순서만 관리. 자식은 결함 보고·변경 제안 양식을 사용하며 재현·구현·개별 검증은 자식에 작성. 하나의 PR로 끝나는 작업에는 부모를 만들지 않음.
        생성 직후 성격(`bug` 또는 `enhancement`)·영역 라벨과 정확히 하나의 `priority:*` 라벨 적용. 자식의 라벨을 합치거나 우선순위를 물려주지 않음.
        자식 등록 직후 GitHub sub-issue로 연결. 본문 목록은 보조 기록.

  - type: textarea
    id: shared_context
    attributes:
      label: 공통 현재 상태 (AS-IS)와 목표 상태 (TO-BE)
      description: 전체 작업의 현재 문제와 최종 목표를 각각 1~2문장으로 작성. 확인된 사실과 가설을 구분.
      placeholder: |
        - AS-IS: 공통 문제와 영향받는 기능:
        - TO-BE: 모든 자식 작업이 끝난 뒤 기대하는 전체 결과:
        - 자식 작업으로 분리해야 하는 이유:
        - 확인 근거: 확장 버전·커밋, 관찰 근거와 관련 이슈:
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 공통 범위와 제외 범위
      placeholder: |
        - 포함 범위:
        - 공통으로 보존할 동작:
        - 제외 범위:
    validations:
      required: true

  - type: textarea
    id: children
    attributes:
      label: 자식 작업과 진행 순서
      description: 자식별 범위·선행 관계·병렬 가능 여부. 등록 전에는 작업명으로 기재하고 등록 직후 실제 GitHub sub-issue 관계로 연결.
      placeholder: |
        - 자식 이슈 또는 작업명 / 담당 범위 / 선행 작업 / 병렬 가능 여부:
        - 전체 랜딩 순서와 통합 확인 시점:
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 요청 우선순위
      description: 부모라는 이유로 우선순위를 높이지 않음. 자식은 각자의 실제 영향으로 별도 판정.
      options:
        - "priority:critical (P0) - 배포 빌드의 데이터 손실·개인정보 유출·전면 동작 불가"
        - "priority:high (P1) - 주요 기능의 잘못된 결과, 검사 실패, 릴리스 차단"
        - "priority:medium (P2) - 현재 기능의 유지보수·성능·검증 개선"
        - "priority:low (P3) - 영향이 좁거나 미룰 수 있는 문안·표시"
    validations:
      required: true

  - type: textarea
    id: priority_rationale
    attributes:
      label: 우선순위 근거
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 공통 완료 조건
      description: 자식 종료와 별도로 전체 목표 상태를 확인할 통합 결과. 부모 종료 전 sub-issue 목록에서 모든 자식의 종료 상태를 확인.
      placeholder: |
        - [ ] 모든 자식 이슈 종료 확인
        - [ ] 공통 목표 상태와 보존할 동작 검증
        - [ ] 필요한 통합 검증(test:e2e·수동 체크리스트) 결과 확인
    validations:
      required: true

  - type: checkboxes
    id: submission_checks
    attributes:
      label: 등록 확인
      options:
        - label: 최신 main과 열린 관련 이슈를 확인하고 기존 부모와의 중복 여부를 검토했습니다.
          required: true
        - label: 생성 직후 성격·영역 라벨과 정확히 하나의 `priority:*` 라벨을 적용합니다.
          required: true
        - label: 자식 등록 직후 GitHub sub-issue로 연결하고 자식별 우선순위를 별도 판정합니다.
          required: true
