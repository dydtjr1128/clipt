name: 결함 보고
description: 현재 동작의 오류, 회귀, 검사 실패를 재현 정보와 함께 등록합니다.
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: 요약
      description: 문제와 해결 방향을 2~3개 불릿으로 요약. 각 불릿은 한 줄의 짧은 단답형·명사형으로 작성. '~습니다', '~입니다', '~한다' 등 서술형 종결 금지. 상세 근거는 아래 항목에 작성.
      placeholder: |
        - 설정 저장 후 언어 선택 초기화
        - 저장한 언어를 다시 읽도록 복구
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        제목은 대상과 실제 증상을 짧은 명사형으로 작성. `~하는 문제` 또는 `~누락·오류·중복`으로 종결하며 증상이 명확하면 `문제` 생략. 예: `설정 저장 후 언어 선택 초기화`, `전체 페이지 캡처에서 고정 헤더 중복`.
        생성 직후 라벨을 확인. 성격은 `bug`(회귀는 `bug` + `regression`), 영역은 `area:*` 중 실제 변경에 해당하는 것만, 우선순위는 `priority:*` 정확히 하나. 허용 목록은 AGENTS.md의 라벨 절.
        여러 자식 작업으로 나눠 관리할 공통 사건은 부모 이슈 양식 사용.

  - type: textarea
    id: environment
    attributes:
      label: 확인 기준
      description: 확인한 확장 버전(또는 커밋), Chrome 버전, 운영체제, 대상 페이지 URL, 관찰 일시. 모르는 항목은 미확인으로 표시.
      placeholder: |
        - 확장 버전 또는 커밋:
        - Chrome 버전과 운영체제:
        - 대상 페이지와 관찰 일시:
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: 실제 동작 (AS-IS)
      description: 문제가 발생한 입력·상황과 실제 관찰한 결과. 작은 결함은 1~2문장으로 충분하며 원인 추정은 원인 분석에 작성.
      placeholder: |
        - 문제가 발생한 입력·상황:
        - 실제 출력·오류 또는 동작:
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: 기대 동작 (TO-BE)
      description: 같은 입력·상황에서 기대하는 정상 결과. 관련 문서(README, docs/ux-design.md)가 있으면 인용.
      placeholder: |
        - 기대하는 출력·동작:
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 또는 증거
      description: 실제 동작을 다시 확인할 최소 단계나 로그·캡처 결과. 직접 재현할 수 없으면 관찰 근거와 확인하지 못한 조건을 구분. 비밀키와 개인정보 제거.
      placeholder: |
        1. 실행 또는 입력
        2. 관찰된 출력
        3. 재현 빈도와 증거 위치
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 영향 범위
      description: 영향받는 기능(캡처·녹화 모드, 설정, 결과 페이지)과 사용자 손실, 우회 방법.
      placeholder: |
        - 영향받는 기능:
        - 손실 또는 차단 범위와 우회 방법:
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 요청 우선순위
      description: 최종 권위는 생성 후 적용하는 `priority:*` 라벨. 기준은 AGENTS.md의 라벨 절.
      options:
        - "priority:critical (P0) - 배포 빌드의 데이터 손실·개인정보 유출·전면 동작 불가"
        - "priority:high (P1) - 주요 기능의 잘못된 결과, 검사 실패, 릴리스 차단"
        - "priority:medium (P2) - 현재 기능의 유지보수·성능·검증 개선"
        - "priority:low (P3) - 영향이 좁거나 미룰 수 있는 문안·표시"
    validations:
      required: true

  - type: textarea
    id: priority_rationale
    attributes:
      label: 우선순위 근거
      description: 우선순위 기준에 해당하는 현재 영향과 증거. P0·P1은 영향 버전·기능과 재현·증거 포함.
    validations:
      required: true

  - type: textarea
    id: cause_analysis
    attributes:
      label: 원인 분석 (선택)
      description: 확인된 원인과 가설을 구분하고 근거를 작성. 원인을 모르면 비워 둠.
      placeholder: |
        - 확인한 원인 또는 원인 가설 (확인 여부 표시):
        - 근거가 되는 코드·로그:
        - 아직 확인하지 못한 점:

  - type: textarea
    id: scope_design
    attributes:
      label: 해결 방향과 범위 (선택)
      description: 기대 동작을 복구할 최소 변경과 보존할 동작. 미정이면 비워 둠.
      placeholder: |
        - 최소 변경:
        - 보존할 동작:
        - 비범위:

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 같은 재현 조건에서 기대 동작을 확인할 수 있는 결과를 체크박스로 작성. 기존 정상 동작의 보존도 포함.
      placeholder: |
        - [ ] 같은 재현 조건에서 기대 동작 확인
        - [ ] 기존 정상 동작 유지
        - [ ] typecheck·lint·test(필요 시 test:e2e) 통과
    validations:
      required: true

  - type: textarea
    id: relationships
    attributes:
      label: 중복 판정과 의존성 (선택)
      description: 검색한 관련 이슈, 선행·후행 관계 또는 비중복 근거.
      placeholder: |
        - 검색어와 확인한 이슈:
        - 선행·후행 의존성:

  - type: checkboxes
    id: submission_checks
    attributes:
      label: 등록 확인
      options:
        - label: 열린 이슈와 최신 main을 확인했습니다.
          required: true
        - label: 로그·캡처에서 비밀키, 개인정보, 불필요한 절대경로를 제거했거나 해당 없음입니다.
          required: true
        - label: 생성 직후 성격·영역 라벨과 정확히 하나의 `priority:*` 라벨을 적용합니다.
          required: true
