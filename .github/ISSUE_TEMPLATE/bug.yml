name: 결함 보고
description: 현재 동작의 오류, 회귀, 검사 실패를 재현 정보와 함께 등록
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        **작성 요령**
        - **제목**: 대상과 실제 증상을 짧은 명사형으로 표현. 증상이 명확하면 `문제` 생략. 예: `설정 저장 후 언어 선택 초기화`, `전체 페이지 캡처에서 고정 헤더 중복`
        - **원인**: 확인한 증상과 추정 원인을 구분. 원인을 몰라도 관찰한 증거로 등록 가능
        - **라벨**: 생성 직후 확인. 성격은 `bug`(회귀는 `bug` + `regression`), 영역은 `area:*` 중 실제 변경에 해당하는 것만, 우선순위는 `priority:*` 정확히 하나. 허용 목록은 AGENTS.md의 라벨 절
        - **이슈 번호**: 목록 안의 `#번호`는 GitHub가 제목·상태로 펼쳐 줄이 길어짐. 목록 한 줄에는 번호 하나만 쓰고 여러 번호·관계는 표나 문장으로 작성
        - **흐름도**: 재현·처리 흐름이 복잡할 때만 아래 `흐름도 (선택)`에 Mermaid로 추가. 짧은 흐름은 `입력 → 처리 → 결과`처럼 한 줄이면 충분
        - **분할**: 여러 자식 작업으로 나눠 관리할 공통 사건은 부모 이슈 양식 사용

  - type: textarea
    id: summary
    attributes:
      label: 요약
      description: 짧은 불릿 2-3개, 명사형·단답형 종결(`~합니다`·`~습니다`·`~한다` 생략). 상세 근거와 로그는 아래에 작성
      placeholder: |
        - 설정 저장 후 언어 선택 초기화
        - 다시 열 때마다 언어 재설정 필요
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 확인 기준
      description: 확인한 확장 버전(또는 커밋), Chrome 버전, 운영체제, 대상 페이지 URL, 관찰 일시. 모르는 항목은 미확인으로 표시
      placeholder: |
        - 확장 버전 또는 커밋:
        - Chrome 버전과 운영체제:
        - 대상 페이지와 관찰 일시:
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: 현재 동작 (AS-IS)
      description: 문제가 발생한 입력·상황과 실제 결과. 작은 결함은 1-2문장으로 충분하며 원인 추정은 원인 분석에 작성
      placeholder: |
        - 입력·상황:
        - 실제 결과·오류:
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: 기대 동작 (TO-BE)
      description: 같은 입력·상황에서 기대하는 정상 결과. 구현 방법은 적지 않음. 관련 문서(README, docs/ux-design.md)가 있으면 인용
      placeholder: |
        - 기대 결과:
    validations:
      required: true

  - type: textarea
    id: flow_diagram
    attributes:
      label: 흐름도 (선택)
      description: 흐름이 복잡할 때만 Mermaid 코드 입력(본문에는 mermaid 코드 블록으로 들어감). 실선은 현재 경로, 점선은 기대 경로. 단순한 결함은 비워 둠
      placeholder: |
        flowchart LR
          A[입력] --> B{검증}
          B -->|현재| C[잘못된 결과]
          B -.->|기대| D[정상 결과]
      render: mermaid

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법 또는 증거
      description: 최소 재현 단계와 실제 결과. 재현이 어려우면 관찰 시점·빈도·확인한 로그나 코드 기재. 기존 정상 버전과 비교했으면 그 기준도 작성. 비밀키와 개인정보 제거
      placeholder: |
        1. 실행 환경 또는 입력 준비
        2. 문제가 발생하는 작업 수행
        3. 결과 확인과 재현 빈도
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 영향 범위
      description: 영향받는 기능(캡처·녹화 모드, 설정, 결과 페이지)과 사용자 손실, 우회 방법
      placeholder: |
        - 영향받는 기능:
        - 손실 또는 차단 범위와 우회 방법:
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 요청 우선순위
      description: 최종 권위는 생성 후 적용하는 `priority:*` 라벨. 기준은 AGENTS.md의 라벨 절
      options:
        - "priority:critical (P0) - 배포 빌드의 데이터 손실·개인정보 유출·전면 동작 불가"
        - "priority:high (P1) - 주요 기능의 잘못된 결과, 검사 실패, 릴리스 차단"
        - "priority:medium (P2) - 현재 기능의 유지보수·성능·검증 개선"
        - "priority:low (P3) - 영향이 좁거나 미룰 수 있는 문안·표시"
    validations:
      required: true

  - type: textarea
    id: priority_rationale
    attributes:
      label: 우선순위 근거
      description: 우선순위 기준에 해당하는 현재 영향과 증거. P0·P1은 영향 버전·기능과 재현·증거 포함
    validations:
      required: true

  - type: textarea
    id: cause_analysis
    attributes:
      label: 원인 분석 (선택)
      description: 확인된 원인과 가설을 구분하고 근거를 작성. 원인을 모르면 비워 둠
      placeholder: |
        - 확인한 원인 또는 원인 가설 (확인 여부 표시):
        - 근거가 되는 코드·로그:
        - 아직 확인하지 못한 점:

  - type: textarea
    id: scope_design
    attributes:
      label: 해결 방향과 범위 (선택)
      description: 기대 동작을 복구할 최소 변경과 보존할 동작. 미정이면 비워 둠
      placeholder: |
        - 최소 변경:
        - 보존할 동작:
        - 제외 범위:

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 같은 재현 조건에서 확인할 정상 결과와 보존할 동작을 체크박스로 작성
      placeholder: |
        - [ ] 같은 재현 조건에서 기대 동작 확인
        - [ ] 기존 정상 동작 유지
        - [ ] typecheck·lint·test(필요 시 test:e2e) 통과
    validations:
      required: true

  - type: textarea
    id: relationships
    attributes:
      label: 관련 이슈 (선택)
      description: 검색한 중복·선행·관련 이슈와 비중복 근거. 관계 설정과 진행 계획은 구현 담당자가 필요한 때 보완
      placeholder: |
        | 관계 | 이슈 | 메모 |
        | --- | --- | --- |
        | 선행 | #번호 | 먼저 해결돼야 하는 이유 |
        | 관련 | #번호 | 같은 결함인지 비교할 내용 |

  - type: checkboxes
    id: submission_checks
    attributes:
      label: 등록 확인
      options:
        - label: 관련 이슈와 최신 main에서 같은 결함의 해결 여부 확인
          required: true
        - label: 로그·캡처의 비밀키·개인정보·불필요한 로컬 경로 제거 또는 해당 없음
          required: true
        - label: 생성 직후 성격·영역 라벨과 정확히 하나의 `priority:*` 라벨 적용
          required: true
