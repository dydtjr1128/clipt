name: 변경 제안
description: 기능, 성능, 리팩터링, 문서 또는 저장소 절차 개선을 등록합니다.
labels:
  - enhancement
body:
  - type: textarea
    id: summary
    attributes:
      label: 요약
      description: 현재 불편과 원하는 변경을 2~3개 불릿으로 요약. 각 불릿은 한 줄의 짧은 단답형·명사형으로 작성. '~습니다', '~입니다', '~한다' 등 서술형 종결 금지. 상세 근거는 아래 항목에 작성.
      placeholder: |
        - 결과 페이지에 정렬 옵션 부재
        - 최신순·이름순 정렬 추가로 탐색 편의 개선
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        제목은 대상과 원하는 변경을 짧은 명사형으로 작성. `~추가·개선·명시`처럼 종결. 예: `결과 페이지 정렬 옵션 추가`.
        생성 직후 라벨을 확인. 성격은 `enhancement`, 영역은 `area:*` 중 실제 변경에 해당하는 것만, 우선순위는 `priority:*` 정확히 하나. 허용 목록은 AGENTS.md의 라벨 절.
        여러 자식 작업으로 나눠 관리할 공통 목표는 부모 이슈 양식 사용.

  - type: dropdown
    id: change_type
    attributes:
      label: 변경 유형
      options:
        - 기능
        - UI·UX
        - 성능 또는 품질
        - 리팩터링 또는 유지보수
        - 문서
        - 테스트·CI·배포
    validations:
      required: true

  - type: textarea
    id: basis
    attributes:
      label: 확인 기준
      description: 확인한 확장 버전(또는 커밋), 사용 상황, 측정값, 사용자 피드백 또는 대조한 문서.
      placeholder: |
        - 확장 버전 또는 커밋:
        - 현재 사용 흐름 또는 사용자 피드백:
        - 대조한 코드·측정값·문서:
    validations:
      required: true

  - type: textarea
    id: current_state
    attributes:
      label: 현재 상태 (AS-IS)
      description: 현재 흐름과 관찰한 불편. 작은 변경은 1~2문장으로 충분.
      placeholder: |
        - 현재 입력·상황과 동작:
        - 불편 또는 개선이 필요한 지점:
    validations:
      required: true

  - type: textarea
    id: target_state
    attributes:
      label: 목표 상태 (TO-BE)
      description: 같은 입력·상황에서 변경 뒤 달라질 결과. 구현 방법은 해결 방안에 작성.
      placeholder: |
        - 변경 뒤 기대하는 동작·결과:
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 요청 우선순위
      description: 최종 권위는 생성 후 적용하는 `priority:*` 라벨. 기준은 AGENTS.md의 라벨 절.
      options:
        - "priority:high (P1) - 주요 기능의 잘못된 결과, 검사 실패, 릴리스 차단"
        - "priority:medium (P2) - 현재 기능의 유지보수·성능·검증 개선"
        - "priority:low (P3) - 영향이 좁거나 미룰 수 있는 문안·표시"
    validations:
      required: true

  - type: textarea
    id: priority_rationale
    attributes:
      label: 우선순위 근거
      description: 우선순위 기준에 해당하는 현재 영향과 증거.
    validations:
      required: true

  - type: textarea
    id: scope_design
    attributes:
      label: 제안하는 해결 방안과 범위
      description: 목표 상태를 만드는 최소 변경과 범위. 새 권한·의존성·설정 항목이 필요하면 근거와 대안을 함께 작성. 방법이 미정이면 다음 확인 방법을 작성.
      placeholder: |
        - 최소 변경과 채택 이유:
        - 변경할 위치(컨텍스트·모듈·문서):
        - 새 권한·의존성·설정 여부와 대안:
        - 보존할 동작:
        - 비범위:
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 목표 상태의 달성을 확인할 입력·상황과 관찰 결과를 체크박스로 작성. 구현 절차보다 검증 가능한 결과.
      placeholder: |
        - [ ] 대표 입력·상황에서 목표 동작 확인
        - [ ] 보존할 정상 동작 확인
        - [ ] typecheck·lint·test(필요 시 test:e2e) 통과, 문서 갱신
    validations:
      required: true

  - type: textarea
    id: relationships
    attributes:
      label: 대안·참고 자료와 의존성 (선택)
      description: 기존 기능 활용 가능성, 검토한 대안, 관련 이슈·문서, 선행·후행 관계.
      placeholder: |
        - 검토한 대안:
        - 관련 이슈·문서:
        - 선행·후행 의존성:

  - type: checkboxes
    id: submission_checks
    attributes:
      label: 등록 확인
      options:
        - label: 열린 이슈와 최신 main을 확인했습니다.
          required: true
        - label: 생성 직후 성격·영역 라벨과 정확히 하나의 `priority:*` 라벨을 적용합니다.
          required: true
