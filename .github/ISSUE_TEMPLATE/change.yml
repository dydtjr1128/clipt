name: 기능·개선 제안
description: 기능, 성능, 리팩터링, 문서 또는 저장소 절차 개선 제안
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        **작성 요령**
        - **제목**: 대상과 원하는 변경을 짧은 명사형으로 표현. `~추가·개선·명시`처럼 종결. 예: `결과 페이지 정렬 옵션 추가`
        - **라벨**: 생성 직후 확인. 성격은 `enhancement`, 영역은 `area:*` 중 실제 변경에 해당하는 것만, 우선순위는 `priority:*` 정확히 하나. 허용 목록은 AGENTS.md의 라벨 절
        - **이슈 번호**: 목록 안의 `#번호`는 GitHub가 제목·상태로 펼쳐 줄이 길어짐. 목록 한 줄에는 번호 하나만 쓰고 여러 번호·관계는 표나 문장으로 작성
        - **흐름도**: 구조·흐름 변화가 복잡할 때만 아래 `흐름도 (선택)`에 Mermaid로 추가. 짧은 흐름은 `입력 → 처리 → 결과`처럼 한 줄이면 충분
        - **분할**: 독립적으로 끝낼 결과는 별도 구현 이슈로 나누고 공통 목표는 부모 이슈로 관리. 같은 완료 조건의 여러 PR은 이 양식에서 진행 관리

  - type: textarea
    id: summary
    attributes:
      label: 요약
      description: 짧은 불릿 2-3개, 명사형·단답형 종결(`~합니다`·`~습니다`·`~한다` 생략). 배경과 구현 상세는 아래에 작성
      placeholder: |
        - 결과 페이지에 정렬 옵션 부재
        - 최신순·이름순 정렬 추가로 탐색 편의 개선
    validations:
      required: true

  - type: dropdown
    id: change_type
    attributes:
      label: 변경 유형
      options:
        - 기능
        - UI·UX
        - 성능 또는 품질
        - 리팩터링 또는 유지보수
        - 문서
        - 테스트·CI·배포
    validations:
      required: true

  - type: textarea
    id: basis
    attributes:
      label: 확인 기준
      description: 확인한 확장 버전(또는 커밋), 사용 상황, 측정값, 사용자 피드백 또는 대조한 코드·문서. 모르는 항목은 미확인으로 표시
      placeholder: |
        - 확장 버전 또는 커밋:
        - 현재 사용 흐름 또는 사용자 피드백:
        - 대조한 코드·측정값·문서:
    validations:
      required: true

  - type: textarea
    id: current_state
    attributes:
      label: 현재 상태와 필요성 (AS-IS)
      description: 누가 어떤 상황에서 겪는 불편인지, 현재 방법의 한계. 작은 변경은 1-2문장으로 충분
      placeholder: |
        - 현재 동작·사용 방법:
        - 불편 또는 한계:
    validations:
      required: true

  - type: textarea
    id: target_state
    attributes:
      label: 목표 상태 (TO-BE)
      description: 같은 입력·상황에서 변경 뒤 달라질 결과. 구현 방법은 아래 제안에 작성
      placeholder: |
        - 변경 뒤 기대하는 동작·결과:
    validations:
      required: true

  - type: textarea
    id: flow_diagram
    attributes:
      label: 흐름도 (선택)
      description: 구조·흐름 변화가 복잡할 때만 Mermaid 코드 입력(본문에는 mermaid 코드 블록으로 들어감). 실선은 현재 경로, 점선은 목표 경로. 단순한 변경은 비워 둠
      placeholder: |
        flowchart LR
          A[입력] --> B[현재 처리] --> C[현재 결과]
          A -.->|목표| D[새 처리] -.-> E[목표 결과]
      render: mermaid

  - type: dropdown
    id: priority
    attributes:
      label: 요청 우선순위
      description: 최종 권위는 생성 후 적용하는 `priority:*` 라벨. 기준은 AGENTS.md의 라벨 절
      options:
        - "priority:high (P1) - 주요 기능의 잘못된 결과, 검사 실패, 릴리스 차단"
        - "priority:medium (P2) - 현재 기능의 유지보수·성능·검증 개선"
        - "priority:low (P3) - 영향이 좁거나 미룰 수 있는 문안·표시"
    validations:
      required: true

  - type: textarea
    id: priority_rationale
    attributes:
      label: 우선순위 근거
      description: 우선순위 기준에 해당하는 현재 영향과 증거
    validations:
      required: true

  - type: textarea
    id: scope_design
    attributes:
      label: 제안하는 방법과 범위
      description: 목표 상태를 만드는 최소 변경과 포함·제외 범위. 새 권한·의존성·설정 항목·기능은 실제 사용처와 기존 방법으로 해결할 수 없는 이유 작성. 방법이 미정이면 다음 확인 방법 작성
      placeholder: |
        - 제안 방법과 채택 이유:
        - 변경할 위치(컨텍스트·모듈·문서):
        - 새 권한·의존성·설정 여부와 더 작은 대안:
        - 포함 범위:
        - 보존할 동작:
        - 제외 범위:
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 구현 절차보다 확인 가능한 입력·상황과 결과를 체크박스로 작성
      placeholder: |
        - [ ] 대표 입력·상황에서 목표 동작 확인
        - [ ] 보존할 정상 동작 확인
        - [ ] typecheck·lint·test(필요 시 test:e2e) 통과, 문서 갱신
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 대안과 참고 자료 (선택)
      description: 기존 기능 활용 가능성, 검토한 대안, 관련 문서, 호환성 영향

  - type: textarea
    id: relationships
    attributes:
      label: 관련 이슈 (선택)
      description: 이미 확인한 중복·선행·관련 이슈가 있으면 작성. 관계 설정과 진행 계획은 구현 담당자가 필요한 때 보완
      placeholder: |
        | 관계 | 이슈 | 메모 |
        | --- | --- | --- |
        | 선행 | #번호 | 먼저 끝나야 하는 이유 |
        | 관련 | #번호 | 함께 확인할 내용 |

  - type: checkboxes
    id: submission_checks
    attributes:
      label: 등록 확인
      options:
        - label: 관련 이슈와 최신 main의 구현·문서에서 같은 제안 또는 이미 제공되는 기능 확인
          required: true
        - label: 첨부 자료의 비밀키·개인정보·불필요한 로컬 경로 제거 또는 해당 없음
          required: true
        - label: 생성 직후 성격·영역 라벨과 정확히 하나의 `priority:*` 라벨 적용
          required: true
