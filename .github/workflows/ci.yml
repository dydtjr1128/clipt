name: CI

on:
  pull_request:
  push:
    branches: [main]

# PR은 새 푸시가 오면 이전 실행을 취소한다. main은 커밋마다 끝까지 돌린다(버전을 올린 커밋의 CI 성공이 자동 릴리스 조건)
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: 타입·lint·단위 테스트·빌드
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 배포 빌드(소스·런타임 의존성)가 바뀌었는데 버전이 그대로인 PR에 경고(AGENTS.md 버전과 변경기록)
      - name: 배포 빌드 변경 시 버전 올림 확인
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-version-bump.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  e2e:
    name: 확장 로드 E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Playwright Chromium 설치
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: E2E
        run: xvfb-run --auto-servernum npm run test:e2e
      - name: 실패 자료 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
