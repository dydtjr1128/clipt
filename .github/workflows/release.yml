name: Release

# vX.Y.Z 태그를 푸시하면 검사 후 설치용 zip을 GitHub Release에 올린다.
# PR에서는 릴리스 파일이 만들어지는지만 확인한다(게시하지 않음).
on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'releases/**'
      - 'CHANGELOG.md'
      - 'scripts/release-assets.mjs'
      - 'scripts/check-release.mjs'
      - '.github/workflows/release.yml'
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: 검사와 패키징
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.assets.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run zip
      - name: 배포 zip 검사
        run: node scripts/check-release.mjs
      - name: 릴리스 파일 준비(버전·태그·릴리스 노트 확인)
        id: assets
        run: node scripts/release-assets.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: .output/release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: GitHub Release 게시
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.package.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release
      - name: 받은 파일 확인
        working-directory: release
        run: |
          sha256sum --check SHA256SUMS.txt
          cmp clipt.zip "clipt-${RELEASE_VERSION}.zip"
      - name: Release 생성과 게시
        # 이전 실행이 draft를 남겼으면 지우고 다시 만든다. 이미 게시된 릴리스는 덮어쓰지 않는다
        run: |
          if state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$state" = "true" ]; then
              gh release delete "$RELEASE_TAG" --yes
            else
              echo "::error::$RELEASE_TAG 는 이미 게시된 릴리스입니다. 새 버전으로 태그를 만드세요"
              exit 1
            fi
          fi
          gh release create "$RELEASE_TAG" \
            release/clipt.zip \
            "release/clipt-${RELEASE_VERSION}.zip" \
            release/SHA256SUMS.txt \
            --verify-tag --draft \
            --title "Clipt ${RELEASE_VERSION}" \
            --notes-file release/RELEASE_NOTES.md
          gh release edit "$RELEASE_TAG" --draft=false
