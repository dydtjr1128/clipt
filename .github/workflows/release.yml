name: Release

# 설치용 zip을 GitHub Release에 올린다. 두 경로가 있다.
# - 자동: main 푸시의 CI가 성공하면 그 커밋의 package.json 버전에 vX.Y.Z 태그가 없을 때
#   태그를 만들고 게시한다. 이미 태그가 있으면(버전을 올리지 않은 머지) 아무것도 하지 않는다.
# - 수동: vX.Y.Z 태그를 푸시하면 태그 커밋의 CI(main 푸시, E2E 포함) 성공을 확인한 뒤 게시한다(scripts/ci-gate.mjs).
# PR에서는 릴리스 파일이 만들어지는지만 확인한다(게시하지 않음).
on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'releases/**'
      - 'CHANGELOG.md'
      - 'scripts/release-assets.mjs'
      - 'scripts/check-release.mjs'
      - 'scripts/ci-gate.mjs'
      - '.github/workflows/release.yml'
  push:
    tags: ['v*.*.*']
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: 새 버전 확인
    # main 푸시의 CI가 성공했을 때만. PR·태그 푸시는 이 단계를 건너뛴다
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.check.outputs.release }}
      tag: ${{ steps.check.outputs.tag }}
      sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: package.json 버전의 태그·Release 상태 확인
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        # 태그 없음 → 릴리스. 태그와 게시된 Release가 있음 → 버전을 올리지 않은 머지라 건너뜀.
        # 태그만 있고 Release가 없거나 draft → 이전 게시가 실패한 것. 태그가 이 커밋이면 다시 게시하고, 다른 커밋이면 건너뛰고 경고
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          release=false
          if ! gh api "repos/$GH_REPO/git/ref/tags/$tag" --silent 2>/dev/null; then
            release=true
            echo "$tag 태그 없음. 이 커밋으로 릴리스"
          elif [ "$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
            echo "$tag 릴리스가 이미 게시됨. 버전을 올리지 않은 머지라 건너뜀"
          else
            tagged=$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)
            if [ "$tagged" = "$SHA" ]; then
              release=true
              echo "$tag 태그는 있지만 Release가 게시되지 않음. 같은 커밋으로 다시 게시"
            else
              echo "::warning title=$tag 릴리스 미완료::태그가 다른 커밋(${tagged:0:7})을 가리키고 Release가 게시되지 않았습니다. 그 커밋의 릴리스 실행을 다시 돌리세요"
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

  package:
    name: 검사와 패키징
    needs: [detect]
    # detect는 PR·태그 푸시에서 건너뛰므로 !cancelled()로 이어서 실행한다
    if: >-
      !cancelled() && needs.detect.result != 'failure' &&
      (github.event_name != 'workflow_run' || needs.detect.outputs.release == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.assets.outputs.version }}
    env:
      # 자동 릴리스에서 만들 태그. release-assets.mjs가 버전·main 소속을 확인한다
      RELEASE_TAG: ${{ needs.detect.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run zip
      - name: 배포 zip 검사
        run: node scripts/check-release.mjs
      - name: 릴리스 파일 준비(버전·태그·릴리스 노트 확인)
        id: assets
        run: node scripts/release-assets.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: .output/release/
          if-no-files-found: error
          retention-days: 14

  ci-gate:
    name: 태그 커밋의 CI 성공 확인
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: CI 결과 확인(실행 중이면 대기)
        run: node scripts/ci-gate.mjs

  publish:
    name: GitHub Release 게시
    needs: [detect, package, ci-gate]
    # 수동 태그는 ci-gate 성공, 자동 릴리스는 detect가 새 버전을 찾았을 때(CI 성공은 workflow_run 조건으로 확인됨)
    if: >-
      !cancelled() && needs.package.result == 'success' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.ci-gate.result == 'success') ||
      (github.event_name == 'workflow_run' && needs.detect.outputs.release == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.detect.outputs.tag || github.ref_name }}
      RELEASE_VERSION: ${{ needs.package.outputs.version }}
      RELEASE_SHA: ${{ needs.detect.outputs.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release
      - name: 받은 파일 확인
        working-directory: release
        run: |
          sha256sum --check SHA256SUMS.txt
          cmp clipt.zip "clipt-${RELEASE_VERSION}.zip"
      - name: 자동 릴리스 태그 만들기
        if: github.event_name == 'workflow_run'
        # GITHUB_TOKEN으로 만든 태그는 태그 푸시 워크플로를 다시 띄우지 않는다(이중 게시 없음).
        # 태그가 이미 있으면(재시도·동시 수동 태그) 패키징한 커밋을 가리킬 때만 이어서 게시한다
        run: |
          if ! gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --silent 2>/dev/null; then
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$RELEASE_SHA" --silent
          fi
          tagged=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          if [ "$tagged" != "$RELEASE_SHA" ]; then
            echo "::error::$RELEASE_TAG 태그가 패키징한 커밋(${RELEASE_SHA:0:7})이 아닌 ${tagged:0:7}을 가리킴. 게시 중단"
            exit 1
          fi
          echo "$RELEASE_TAG → $tagged"
      - name: Release 생성과 게시
        # 이전 실행이 draft를 남겼으면 지우고 다시 만든다. 이미 게시된 릴리스는 덮어쓰지 않는다
        run: |
          if state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$state" = "true" ]; then
              gh release delete "$RELEASE_TAG" --yes
            else
              echo "::error::$RELEASE_TAG 는 이미 게시된 릴리스입니다. 새 버전으로 태그를 만드세요"
              exit 1
            fi
          fi
          gh release create "$RELEASE_TAG" \
            release/clipt.zip \
            "release/clipt-${RELEASE_VERSION}.zip" \
            release/SHA256SUMS.txt \
            --verify-tag --draft \
            --title "Clipt ${RELEASE_VERSION}" \
            --notes-file release/RELEASE_NOTES.md
          gh release edit "$RELEASE_TAG" --draft=false
